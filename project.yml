name: OnThisDay
options:
  bundleIdPrefix: com.prandell
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: ""          # set your (free) Personal Team ID, or pick it in Xcode
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  OnThisDay:
    type: application
    platform: iOS
    sources: [App, Shared]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: On This Day
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSPhotoLibraryUsageDescription: Shows photos taken on this date in past years so you can keep or delete them.
        CFBundleURLTypes:
          - CFBundleURLName: com.prandell.onthisday
            CFBundleURLSchemes: [onthisday]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prandell.onthisday
    dependencies:
      - target: OnThisDayWidget
  OnThisDayWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: On This Day
        NSPhotoLibraryUsageDescription: Shows a photo taken on this date in past years.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prandell.onthisday.widget
